<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyler Nicholas | Official Portal</title>
    <link rel="icon" href="tyler n.jpg" type="image/jpeg">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta name="google-site-verification" content="B0hBtQ3dAMciRKv-HCXQvZqHk8mQu-tvbi0NRnt9oEk" />

    <style>
        :root {
            --bg-off-white: #f8fbfc;
            --bg-white: #ffffff;
            --campaign-blue: #00AEEF;
            --campaign-red: #E60026; /* Bringing in the red from your campaign site */
            --black: #111111;
            --text-subtitle: #666666;
            --border-light: #e0e6ed;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: var(--bg-off-white);
            color: var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 5%;
        }

        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
        }

        .portal-container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg-white);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
        }

        .portal-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .portal-header p {
            color: var(--text-subtitle);
            font-size: 1.1rem;
            margin-bottom: 3rem;
        }

        /* The Split Choices */
        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .choice-card {
            background-color: var(--bg-white);
            padding: 3rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            color: var(--black);
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            border: 1px solid var(--border-light);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .choice-card i {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            transition: transform 0.3s ease;
        }

        .choice-card h2 {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .choice-card p {
            font-size: 0.95rem;
            color: var(--text-subtitle);
        }

        /* Hover Effects to Match Branding */
        .portfolio-card:hover {
            border-color: var(--campaign-blue);
            box-shadow: 0 15px 40px rgba(0, 174, 239, 0.15);
            transform: translateY(-5px);
        }
        .portfolio-card:hover i {
            color: var(--campaign-blue);
            transform: scale(1.1);
        }

        .campaign-card:hover {
            border-color: var(--campaign-red);
            box-shadow: 0 15px 40px rgba(230, 0, 38, 0.15);
            transform: translateY(-5px);
        }
        .campaign-card:hover i {
            color: var(--campaign-red);
            transform: scale(1.1);
        }

        /* Social Links */
        .social-directory {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .social-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--bg-white);
            border: 1px solid var(--border-light);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--black);
            font-size: 1.2rem;
            text-decoration: none;
            transition: all 0.3s;
        }

        .social-circle:hover {
            background-color: var(--black);
            color: var(--bg-white);
            border-color: var(--black);
            transform: translateY(-3px);
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .choice-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .portal-header h1 {
                font-size: 1.8rem;
            }
            .choice-card {
                padding: 2.5rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="portal-container">
        
        <div class="portal-header">
            <img src="tyler n.jpg" alt="Tyler Nicholas" class="profile-pic">
            <h1>Tyler Nicholas</h1>
            <p>Welcome. Please select your destination.</p>
        </div>

        <div class="choice-grid">
            
            <a href="https://tyler-nicholas.online" class="choice-card portfolio-card">
                <i class="fa-solid fa-briefcase" style="color: var(--campaign-blue);"></i>
                <h2>Professional Portfolio</h2>
                <p>Ventures, Aviation & Civic Leadership</p>
            </a>

            <a href="https://vote.tyler-nicholas.online" class="choice-card campaign-card">
                <i class="fa-solid fa-check-to-slot" style="color: var(--campaign-red);"></i>
                <h2>SNYA Campaign</h2>
                <p>Vision & Policies for the 21st Cohort</p>
            </a>

        </div>

        <div class="social-directory">
            <a href="https://www.linkedin.com/in/tyler-nicholas-62999534a" target="_blank" class="social-circle" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
            <a href="https://x.com/TylerNicholasSC" target="_blank" class="social-circle" title="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://www.instagram.com/t.nicholas26" target="_blank" class="social-circle" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://wa.me/qr/HVGZ3S2BPARJL1" target="_blank" class="social-circle" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="https://www.snapchat.com/add/t.nicholas2008" target="_blank" class="social-circle" title="Snapchat"><i class="fa-brands fa-snapchat"></i></a>
        </div>

    </div>

</body>
</html>
