<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Tyler Nicholas</title>
    <link rel="icon" href="https://media.licdn.com/dms/image/v2/D4D03AQGRKh3DGxSABQ/profile-displayphoto-scale_400_400/B4DZr4z1B9GwAg-/0/1765110932319?e=1774483200&v=beta&t=kfbgGyoPquwXygrYf0wrgOBTe-Mu4JydRJcYd3WKm4g" type="image/jpeg">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-off-white: #f8fbfc;
            --bg-white: #ffffff;
            --black: #111111;
            --text-subtitle: #666666;
            --border-light: #e0e6ed;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: var(--bg-off-white);
            color: var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 5%;
        }

        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
        }

        .portal-container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .error-icon {
            font-size: 4rem;
            color: var(--black);
            margin-bottom: 1.5rem;
            opacity: 0.1;
        }

        .portal-header h1 {
            font-size: 6rem;
            font-weight: 800;
            margin-bottom: 0rem;
            line-height: 1;
            color: var(--black);
            letter-spacing: -2px;
        }

        .portal-header h2 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--black);
        }

        .portal-header p {
            color: var(--text-subtitle);
            font-size: 1.1rem;
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        .btn-return {
            display: inline-block;
            background-color: var(--bg-white);
            color: var(--black);
            padding: 1rem 2.5rem;
            text-decoration: none;
            font-weight: 800;
            border-radius: 8px;
            font-size: 1.1rem;
            border: 1px solid var(--border-light);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .btn-return:hover {
            background-color: var(--black);
            color: var(--bg-white);
            border-color: var(--black);
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .portal-header h1 {
                font-size: 5rem;
            }
            .portal-header h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <div class="error-icon">
            <i class="fa-solid fa-link-slash"></i>
        </div>
        
        <div class="portal-header">
            <h1>404</h1>
            <h2>Link Not Found</h2>
            <p>It looks like this link has been moved or updated. Let's get you back to the main portal so you can find what you are looking for.</p>
        </div>

        <a href="/" class="btn-return">Return to Main Portal</a>
    </div>

</body>
</html>
